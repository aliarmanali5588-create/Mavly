# Installed into $GRADLE_USER_HOME/gradle.properties in the image.
#
# Generated Android projects are not required to contain a gradle.properties
# file, but AGP refuses AndroidX dependencies without `android.useAndroidX`.
# Gradle merges these user-home properties into every project, so the build is
# reproducible even when the model omits the file or writes its own. A project
# file may still override these values.
#
# Do not add credentials, repositories, mirrors or signing values here.
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.parallel=false
org.gradle.configureondemand=false
