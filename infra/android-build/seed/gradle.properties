# Seed-only Gradle properties. `android.useAndroidX` comes from the image's
# $GRADLE_USER_HOME/gradle.properties, so this file deliberately does not set it:
# the seed build proves the global fallback works for generated projects that
# omit gradle.properties.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.daemon=false
kotlin.code.style=official
