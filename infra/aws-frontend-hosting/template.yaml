AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 and CloudFront edge routing for Mavly static tenant sites.

Parameters:
  DeploymentStage:
    Type: String
    Default: staging
    AllowedValues:
      - staging
      - production
    Description: Deployment label used for operator review and staging alias derivation.
  ViewerCertificateArn:
    Type: String
    Description: Validated ACM certificate in us-east-1 covering *.mavly.xyz.
    AllowedPattern: "^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-fA-F-]+$"
  StagingProjectId:
    Type: String
    Default: ""
    Description: Existing validated project ID whose exact .mavly.xyz hostname is used by a staging distribution. Ignored for production.
    AllowedPattern: "^$|^(?!(?:xn--))[a-z](?:[a-z0-9]|-(?!-)){0,62}(?<!-)$"
  ExistingWorkerRoleName:
    Type: String
    Description: Existing EC2 worker role name. No EC2 instance or instance profile is created.
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"
  CreateFrontendBucket:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create an isolated bucket for staging. Set false only after reconciling an existing bucket and its policy.
  ExistingFrontendBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: Existing bucket name when CreateFrontendBucket is false. The stack does not create or rename it.
  CreateTenantRouteStore:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create an isolated KVS for staging. Set false only for an explicitly reconciled existing KVS ARN.
  ExistingTenantRouteStoreArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:cloudfront::[0-9]{12}:key-value-store/[a-f0-9-]+$"
    Description: Existing KVS ARN when CreateTenantRouteStore is false. The stack does not delete or recreate it.
  ManageFrontendBucketPolicy:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Manage the bucket policy only for a newly created staging bucket; false preserves an existing policy for operator reconciliation.
  AttachWorkerHostingPolicy:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Attach a stack-scoped least-privilege policy to the existing worker role. Set false when an existing reviewed policy already covers the target resources.

Conditions:
  CreateBucket: !Equals [!Ref CreateFrontendBucket, "true"]
  CreateKvs: !Equals [!Ref CreateTenantRouteStore, "true"]
  IsStaging: !Equals [!Ref DeploymentStage, staging]
  ManageBucketPolicy: !And
    - !Equals [!Ref ManageFrontendBucketPolicy, "true"]
    - !Condition CreateBucket
  AttachWorkerPolicy: !Equals [!Ref AttachWorkerHostingPolicy, "true"]

Rules:
  ExistingResourceParameters:
    RuleCondition: !Equals [!Ref CreateFrontendBucket, "false"]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingFrontendBucketName, ""]]
        AssertDescription: ExistingFrontendBucketName is required when CreateFrontendBucket is false.
  ExistingKvsParameters:
    RuleCondition: !Equals [!Ref CreateTenantRouteStore, "false"]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingTenantRouteStoreArn, ""]]
        AssertDescription: ExistingTenantRouteStoreArn is required when CreateTenantRouteStore is false.
  ExistingBucketPolicy:
    RuleCondition: !Equals [!Ref CreateFrontendBucket, "false"]
    Assertions:
      - Assert: !Equals [!Ref ManageFrontendBucketPolicy, "false"]
        AssertDescription: An existing bucket policy must be reconciled separately; set ManageFrontendBucketPolicy to false.
  StagingAliasMustBeExact:
    RuleCondition: !Equals [!Ref DeploymentStage, staging]
    Assertions:
      - Assert: !Not [!Equals [!Ref StagingProjectId, ""]]
        AssertDescription: StagingProjectId is required for an exact staging tenant alias.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "api"]]
        AssertDescription: Staging cannot claim the reserved api hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "www"]]
        AssertDescription: Staging cannot claim the reserved www hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "adminsh"]]
        AssertDescription: Staging cannot claim the reserved adminsh hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "dashboard"]]
        AssertDescription: Staging cannot claim the reserved dashboard hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "auth"]]
        AssertDescription: Staging cannot claim the reserved auth hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "app"]]
        AssertDescription: Staging cannot claim the reserved app hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "admin"]]
        AssertDescription: Staging cannot claim the reserved admin hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "internal"]]
        AssertDescription: Staging cannot claim the reserved internal hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "system"]]
        AssertDescription: Staging cannot claim the reserved system hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "careers"]]
        AssertDescription: Staging cannot claim the reserved careers hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "changelog"]]
        AssertDescription: Staging cannot claim the reserved changelog hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "contact"]]
        AssertDescription: Staging cannot claim the reserved contact hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "credit-topup"]]
        AssertDescription: Staging cannot claim the reserved credit-topup hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "docs"]]
        AssertDescription: Staging cannot claim the reserved docs hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "faq"]]
        AssertDescription: Staging cannot claim the reserved faq hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "features"]]
        AssertDescription: Staging cannot claim the reserved features hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "home"]]
        AssertDescription: Staging cannot claim the reserved home hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "integrations"]]
        AssertDescription: Staging cannot claim the reserved integrations hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "login"]]
        AssertDescription: Staging cannot claim the reserved login hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "preview"]]
        AssertDescription: Staging cannot claim the reserved preview hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "privacy"]]
        AssertDescription: Staging cannot claim the reserved privacy hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "project"]]
        AssertDescription: Staging cannot claim the reserved project hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "projects"]]
        AssertDescription: Staging cannot claim the reserved projects hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "signup"]]
        AssertDescription: Staging cannot claim the reserved signup hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "support"]]
        AssertDescription: Staging cannot claim the reserved support hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "terms"]]
        AssertDescription: Staging cannot claim the reserved terms hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "tutorials"]]
        AssertDescription: Staging cannot claim the reserved tutorials hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "upgrade"]]
        AssertDescription: Staging cannot claim the reserved upgrade hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "blog"]]
        AssertDescription: Staging cannot claim the reserved blog hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "help"]]
        AssertDescription: Staging cannot claim the reserved help hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "status"]]
        AssertDescription: Staging cannot claim the reserved status hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "billing"]]
        AssertDescription: Staging cannot claim the reserved billing hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "assets"]]
        AssertDescription: Staging cannot claim the reserved assets hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "cdn"]]
        AssertDescription: Staging cannot claim the reserved cdn hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "files"]]
        AssertDescription: Staging cannot claim the reserved files hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "mail"]]
        AssertDescription: Staging cannot claim the reserved mail hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "ns1"]]
        AssertDescription: Staging cannot claim the reserved ns1 hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "ns2"]]
        AssertDescription: Staging cannot claim the reserved ns2 hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "smtp"]]
        AssertDescription: Staging cannot claim the reserved smtp hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "static"]]
        AssertDescription: Staging cannot claim the reserved static hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "storage"]]
        AssertDescription: Staging cannot claim the reserved storage hostname.
      - Assert: !Not [!Equals [!Ref StagingProjectId, "vercel"]]
        AssertDescription: Staging cannot claim the reserved vercel hostname.

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Condition: CreateBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  TenantRouteStore:
    Type: AWS::CloudFront::KeyValueStore
    Condition: CreateKvs
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${AWS::StackName}-routing"
      Comment: Immutable project-to-publication mappings used by the viewer-request function. The stack name keeps staging isolated.

  TenantRouter:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-router"
      AutoPublish: true
      FunctionConfig:
        Comment: Routes tenant hosts to immutable S3 publication keys.
        Runtime: cloudfront-js-2.0
        KeyValueStoreAssociations:
          - KeyValueStoreARN: !If
              - CreateKvs
              - !GetAtt TenantRouteStore.Arn
              - !Ref ExistingTenantRouteStoreArn
          # When reusing an existing KVS, the ARN is supplied explicitly. The
          # staging default creates a separate KVS and never targets the
          # operator-managed production store.
      FunctionCode: |
        import cf from 'cloudfront';
        const routes = cf.kvs();
        const notFound = { statusCode: 404, statusDescription: 'Not Found' };
          const unavailable = { statusCode: 503, statusDescription: 'Service Unavailable' };
          const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const RESERVED = {
            adminsh: true, api: true, auth: true, careers: true, changelog: true,
            contact: true, 'credit-topup': true, dashboard: true, docs: true,
            faq: true, features: true, home: true, integrations: true, login: true,
            preview: true, privacy: true, project: true, projects: true, signup: true,
            support: true, terms: true, tutorials: true, upgrade: true, blog: true,
            help: true, status: true, www: true, assets: true, cdn: true, files: true,
            mail: true, ns1: true, ns2: true, smtp: true, static: true, storage: true,
            vercel: true, admin: true, app: true, billing: true, internal: true,
            system: true,
          };

        function safePath(path) {
          if (typeof path !== 'string' || path.length > 2048 || path.indexOf('\\') !== -1) return null;
          if (path === '/' || path === '') return '';
          const parts = path.split('/');
          const output = [];
          for (let i = 0; i < parts.length; i++) {
            if (i === 0 && parts[i] === '') continue;
            if (parts[i] === '') return null;
            let segment;
            try { segment = decodeURIComponent(parts[i]); } catch (_) { return null; }
            if (!segment || segment === '.' || segment === '..' || /[%\\?#\u0000-\u001f\u007f/]/.test(segment)) return null;
            output.push(encodeURIComponent(segment));
          }
          return output.join('/');
        }

        async function handler(event) {
          const request = event.request;
          const hostHeader = request.headers.host;
          const host = hostHeader && hostHeader.value ? hostHeader.value.toLowerCase() : '';
          const PROJECT_ID = /^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/;
          const canonical = /^([a-z](?:[a-z0-9]|-(?=[a-z0-9])){0,62})\.mavly\.xyz$/.exec(host);

          let route;
          let routeKey = null;
          try {
            // 1) The canonical <project-id>.mavly.xyz key, unchanged.
            if (canonical) {
              const label = canonical[1];
              if (!label.startsWith('xn--') && RESERVED[label] !== true && await routes.exists(label)) {
                const candidate = await routes.get(label, { format: 'json' });
                if (candidate && candidate.projectId === label) {
                  route = candidate;
                  routeKey = label;
                }
              }
            }
            // 2) An additive hostname-keyed route for an alias or custom domain.
            if (!route) {
              const hostKey = 'h:' + host;
              if (await routes.exists(hostKey)) {
                const candidate = await routes.get(hostKey, { format: 'json' });
                if (candidate && candidate.hostname === host) {
                  route = candidate;
                  routeKey = hostKey;
                }
              }
            }
          } catch (_) {
            return unavailable;
          }
          if (!route || !routeKey) return notFound;
          if (typeof route.projectId !== 'string' || route.projectId.length > 63 ||
              !PROJECT_ID.test(route.projectId) || route.projectId.startsWith('xn--')) {
            return notFound;
          }
          if (canonical && routeKey === canonical[1] && route.projectId !== canonical[1]) {
            return notFound;
          }
          if (routeKey !== route.projectId && route.hostname !== host) return notFound;
          if (!Number.isSafeInteger(route.generation) || route.generation < 1) {
            return notFound;
          }
          if (route.disabled === true) return notFound;
          if (!UUID.test(route.versionId) ||
              typeof route.entryPath !== 'string' || typeof route.spaFallback !== 'boolean') {
            return notFound;
          }

          const entry = safePath(route.entryPath);
          if (!entry) return notFound;
          const rawUri = request.uri;
          const trailingSlash = rawUri.length > 1 && rawUri.endsWith('/');
          let requested = safePath(
            trailingSlash ? rawUri.slice(0, -1) : rawUri,
          );
          if (requested === null) return notFound;

          const last = requested.slice(requested.lastIndexOf('/') + 1);
          const hasExtension = last.indexOf('.') !== -1;
          if (requested === '') {
            requested = entry;
          } else if (route.spaFallback && !hasExtension) {
            requested = entry;
          } else if (trailingSlash) {
            requested += '/index.html';
          }

          request.uri = '/' + route.projectId + '/' + route.versionId + '/' + requested;
          return request;
        }
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-s3-oac"
        Description: CloudFront-only access to the private Mavly publication bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  TenantCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-immutable-tenant-assets"
        Comment: Publication version is in the rewritten URI, so objects are immutable cache keys.
        MinTTL: 0
        DefaultTTL: 86400
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  TenantDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Mavly static tenant hosting.
        HttpVersion: http2and3
        Aliases:
          - !If
              - IsStaging
              - !Sub "${StagingProjectId}.mavly.xyz"
              - "*.mavly.xyz"
        Origins:
          - Id: PrivateS3Origin
            DomainName: !If
              - CreateBucket
              - !GetAtt FrontendBucket.RegionalDomainName
              - !Sub "${ExistingFrontendBucketName}.s3.${AWS::Region}.amazonaws.com"
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: PrivateS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref TenantCachePolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt TenantRouter.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ErrorCachingMinTTL: 5
        PriceClass: PriceClass_100
        Restrictions:
          GeoRestriction:
            RestrictionType: none
        ViewerCertificate:
          AcmCertificateArn: !Ref ViewerCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ManageBucketPolicy
    Properties:
      Bucket: !If
        - CreateBucket
        - !Ref FrontendBucket
        - !Ref ExistingFrontendBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !If
              - CreateBucket
              - !Sub "${FrontendBucket.Arn}/*"
              - !Sub "arn:${AWS::Partition}:s3:::${ExistingFrontendBucketName}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${TenantDistribution}"

  ExistingWorkerHostingPolicy:
    Type: AWS::IAM::Policy
    Condition: AttachWorkerPolicy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-frontend-publisher"
      Roles:
        - !Ref ExistingWorkerRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadAndWriteVersionedObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !If
              - CreateBucket
              - !Sub "${FrontendBucket.Arn}/*"
              - !Sub "arn:${AWS::Partition}:s3:::${ExistingFrontendBucketName}/*"
          - Sid: DetectMissingVersionedObjects
            Effect: Allow
            Action: s3:ListBucket
            Resource: !If
              - CreateBucket
              - !GetAtt FrontendBucket.Arn
              - !Sub "arn:${AWS::Partition}:s3:::${ExistingFrontendBucketName}"
          - Sid: UpdateTenantRouteMappings
            Effect: Allow
            Action:
              - cloudfront-keyvaluestore:DescribeKeyValueStore
              - cloudfront-keyvaluestore:GetKey
              - cloudfront-keyvaluestore:UpdateKeys
            Resource: !If
              - CreateKvs
              - !GetAtt TenantRouteStore.Arn
              - !Ref ExistingTenantRouteStoreArn

Outputs:
  FrontendBucketName:
    Value: !If [CreateBucket, !Ref FrontendBucket, !Ref ExistingFrontendBucketName]
  CloudFrontDistributionId:
    Value: !Ref TenantDistribution
  CloudFrontDomainName:
    Value: !GetAtt TenantDistribution.DomainName
  TenantRouteStoreArn:
    Value: !If [CreateKvs, !GetAtt TenantRouteStore.Arn, !Ref ExistingTenantRouteStoreArn]
  DeploymentStage:
    Value: !Ref DeploymentStage
  StagingProjectId:
    Value: !Ref StagingProjectId
