<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — Mavly</title>
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/applogo/apple-touch-icon.png" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #ffffff;
        color: #1a1a1a;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .logo { width: 120px; height: 120px; margin-bottom: 16px; display: block; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { font-size: 14px; color: #666; margin: 0 0 22px; line-height: 1.5; max-width: 320px; margin-left: auto; margin-right: auto; }
      button {
        background: #1a1a1a;
        color: #ffffff;
        border: none;
        border-radius: 999px;
        padding: 10px 24px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #333; }
      button:focus-visible { outline: 2px solid #1a1a1a; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <img src="/applogo/apple-touch-icon.png" alt="Mavly" class="logo" aria-hidden="true" />
    <h1>You're offline</h1>
    <p>Mavly can't reach the network right now. Cached assets and this page remain available; AI generation, sign-in, and publishing need an internet connection.</p>
    <button onclick="window.location.reload()">Try again</button>
  </body>
</html>
